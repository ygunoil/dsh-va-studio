name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Client bundle protocol
        run: node test/check-client.mjs
      - name: HTTP client tests (no host modules needed)
        run: node --test test/va-client.test.mjs
      - name: Package contents
        run: |
          npm pack --dry-run
          node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) process.exit(1)"
